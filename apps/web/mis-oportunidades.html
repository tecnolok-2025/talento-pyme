<!doctype html>
<html lang="es"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Talento PyME · Mis Oportunidades</title>
<link rel="icon" href="/icon-192.png" />
<link rel="stylesheet" href="/styles.css" />
</head><body class="appShell">
<div class="header"><div class="brand"><img src="/icon-192.png" alt="Talento PyME" /><div><div class="brandTitle">Talento PyME</div><div class="muted">Portal de empleo • <span class="tp-version"></span></div></div></div><div class="nav"><a href="/perfil.html" data-role="CANDIDATE">Mi Perfil</a><a href="/mis-oportunidades.html" class="active" data-role="CANDIDATE">Mis Oportunidades</a><a href="/mis-postulaciones.html" data-role="CANDIDATE">Mis Postulaciones</a><a href="#" id="btnLogout">Salir</a></div></div>
<div class="wrap wide"><div class="heroPanel"><div class="small pageEyebrow">Candidato · oportunidades activas</div><h2 style="margin:8px 0 6px 0">Mis Oportunidades</h2><div class="muted">Buscá avisos publicados por empresas y postuláte si aceptás las condiciones del puesto publicadas en el aviso.</div></div>
<div class="card" style="margin-top:16px"><div class="filtersGrid"><div><label>Puesto o palabra clave</label><input class="input" id="q" placeholder="Ej: supervisor de mantenimiento" /></div><div><label>Empresa</label><input class="input" id="company" placeholder="Filtrar por empresa" /></div></div><div class="row" style="margin-top:12px"><button class="btn" id="btnSearch">Buscar oportunidades</button><span class="muted" id="msg">Listo para buscar.</span></div><div id="list" class="listStack" style="margin-top:16px"></div></div></div>
<script src="/config.js?v=5.4.1"></script><script src="/auth.js?v=5.4.1"></script><script>requireAuth();applyRoleVisibility();requireRole('CANDIDATE');document.getElementById('btnLogout').onclick=(e)=>{e.preventDefault();logout();};function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function load(){const msg=document.getElementById('msg');const q=document.getElementById('q').value.trim();const company=document.getElementById('company').value.trim().toLowerCase();msg.textContent='Buscando…';try{const url=new URL(API_BASE+'/jobs');if(q) url.searchParams.set('q',q);const data=await apiFetch(url.toString().replace(API_BASE,''));let jobs=(data.jobs||[]);if(company) jobs=jobs.filter(j=>String(j.company?.companyName||'').toLowerCase().includes(company));const list=document.getElementById('list');msg.textContent=jobs.length?`${jobs.length} oportunidad(es)`:'Sin resultados';list.innerHTML=jobs.map(j=>`<div class="accordionItem open"><div class="accordionHead"><div><b>${esc(j.title)}</b><div class="muted">${esc(j.company?.companyName||'Empresa')} • ${esc(j.location||'Ubicación a definir')} • ${esc(j.modality||'Modalidad a definir')}</div></div><span>−</span></div><div class="accordionBody"><div class="sectionMini"><b>Descripción</b><br>${esc(j.description||'')}</div>${j.requirements?`<div class="sectionMini"><b>Requisitos</b><br>${esc(j.requirements)}</div>`:''}<div class="row" style="justify-content:flex-end"><button class="btn btnApply" data-id="${j.id}" type="button">Me interesa postularme</button></div></div></div>`).join('')||'<div class="muted">No hay avisos publicados con esos filtros.</div>';list.querySelectorAll('.btnApply').forEach(btn=>btn.onclick=async()=>{msg.textContent='Enviando tu postulación…';try{await apiFetch('/jobs/'+btn.dataset.id+'/apply',{method:'POST',body:JSON.stringify({})});msg.textContent='Tu interés fue enviado. Ya figura en Mis Postulaciones y del lado empresa.';}catch(e){msg.textContent=e.message;}});}catch(e){document.getElementById('msg').textContent=e.message;}}document.getElementById('btnSearch').onclick=load;load();</script></body></html>
